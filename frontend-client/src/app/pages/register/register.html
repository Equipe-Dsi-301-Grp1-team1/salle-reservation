<div class="register-container">
    <h2>Créer un compte client</h2>
    <form (ngSubmit)="inscrire()" #registerForm="ngForm">
        <div>
            <label for="nom">Nom :</label>
            <input id="nom" type="text" name="nom" [(ngModel)]="nom" required />
        </div>
        <div>
            <label for="email">Email :</label>
            <input id="email" type="email" name="email" [(ngModel)]="email" required />
        </div>
        <div>
            <label for="password">Mot de passe :</label>
            <input id="password" type="password" name="password" [(ngModel)]="password" required minlength="6" />
        </div>
        <button type="submit" [disabled]="registerForm.invalid">
            S'inscrire
        </button>
    </form>
    <p class="success">{{ message }}</p>
    <p class="error">{{ erreur }}</p>
    <p>
        Déjà un compte ?
        <a routerLink="/login">Se connecter</a>
    </p>
</div>
