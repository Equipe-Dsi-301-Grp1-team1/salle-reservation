<div class="form-container">
    <h2>Demander une réservation</h2>

    <p class="error" *ngIf="erreur">{{ erreur }}</p>

    <div *ngIf="room">
        <p class="room-name">{{ room.name }}</p>
        <p class="room-info">{{ room.address }} · {{ room.capacity }} personnes</p>
        <p class="room-price">{{ room.pricePerHour }} € par heure</p>
        <p class="chosen-date" *ngIf="date">Date choisie : {{ date }}</p>

        <form>
            <div>
                <label for="hours">Nombre d'heures</label>
                <select id="hours" name="hours" [(ngModel)]="hours">
                    <option *ngFor="let h of heures" [ngValue]="h">{{ h }} h</option>
                </select>
            </div>

            <div class="total">
                <span>Total à payer</span>
                <strong>{{ totalAffiche }}</strong>
            </div>
        </form>
    </div>

    <p class="loading" *ngIf="!room && !erreur">Chargement de la salle...</p>
</div>
